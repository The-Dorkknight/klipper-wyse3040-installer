# With only 2GB RAM, a bit of compressed swap headroom helps (e.g. during
# `pip install` on first provisioning, or nginx+moonraker+klippy all running
# at once). Backed by RAM only — never touches the eMMC, so no wear.
[zram0]
zram-size = min(ram / 2, 1024)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
