# DHCP server for the AP subnet only. DNS is disabled here (port=0) so this
# doesn't fight with systemd-resolved on :53 — clients on the hotspot use
# avahi/mDNS or the printed IP (192.168.7.1) directly.
interface=wlan0
bind-interfaces
except-interface=eth0
port=0

dhcp-range=192.168.7.50,192.168.7.150,255.255.255.0,12h
dhcp-option=option:router,192.168.7.1
